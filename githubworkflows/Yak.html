<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yakihonne Sats Guessing Game</title>
    <style>
        /* --- CSS STYLES --- */
        :root {
            --primary-purple: #6a11cb;
            --secondary-purple: #2575fc;
            --accent-gold: #ffd700;
            --text-color: #ffffff;
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-hover: rgba(255, 255, 255, 0.25);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-purple) 0%, var(--secondary-purple) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 1s ease;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            text-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Grid Container for Buttons */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr); /* 5 columns wide */
            gap: 15px;
            max-width: 800px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Individual Button Styles */
        .game-btn {
            background: var(--btn-bg);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            height: 80px;
            width: 80px; /* Square buttons */
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hover Animation */
        .game-btn:hover {
            transform: translateY(-5px) scale(1.05);
            background: var(--btn-hover);
            border-color: var(--accent-gold);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* Active/Click Animation */
        .game-btn:active {
            transform: scale(0.95);
        }

        /* State styles for after clicking */
        .game-btn.clicked-win {
            background: #2ecc71; /* Green */
            border-color: #2ecc71;
            cursor: default;
        }

        .game-btn.clicked-loss {
            background: #e74c3c; /* Red */
            border-color: #e74c3c;
            opacity: 0.6;
            cursor: default;
        }

        /* --- MODAL (POP UP) STYLES --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            color: #333;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            transform: scale(0.7);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }

        .close-btn {
            background: var(--primary-purple);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: #4a00e0;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .game-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
            .game-btn {
                height: 60px;
                width: 60px;
                font-size: 1.2rem;
            }
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Yakihonne Lucky Draw</h1>
        <p>Pick a number to win Sats!</p>
    </div>

    <div class="game-grid" id="gridContainer">
        </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-content">
            <span id="modalIcon" class="modal-icon"></span>
            <h2 id="modalTitle"></h2>
            <p id="modalMessage"></p>
            <button class="close-btn" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        /* --- JAVASCRIPT LOGIC --- */

        // Configuration
        const totalButtons = 20;
        const winningNumbers = [2, 4, 7, 15, 19];
        const gridContainer = document.getElementById('gridContainer');
        const modal = document.getElementById('resultModal');
        
        // Modal Elements
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');

        // Initialize Game
        function initGame() {
            for (let i = 1; i <= totalButtons; i++) {
                const btn = document.createElement('button');
                btn.classList.add('game-btn');
                btn.textContent = i;
                btn.setAttribute('data-number', i);
                
                // Add Click Event
                btn.addEventListener('click', function() {
                    handleGuess(i, btn);
                });

                gridContainer.appendChild(btn);
            }
        }

        // Handle the Logic
        function handleGuess(number, btnElement) {
            // Prevent clicking the same button twice
            if (btnElement.classList.contains('clicked-win') || btnElement.classList.contains('clicked-loss')) {
                return;
            }

            if (winningNumbers.includes(number)) {
                // WINNER LOGIC
                btnElement.classList.add('clicked-win');
                showModal(true);
            } else {
                // LOSER LOGIC
                btnElement.classList.add('clicked-loss');
                showModal(false);
            }
        }

        // Show the result popup
        function showModal(isWin) {
            modal.classList.add('active');
            
            if (isWin) {
                modalIcon.textContent = "⚡"; // Lightning bolt for Sats
                modalTitle.textContent = "Congratulations!";
                modalTitle.style.color = "#2ecc71";
                modalMessage.textContent = "You Won 1,000 Sats!";
            } else {
                modalIcon.textContent = "😢";
                modalTitle.textContent = "Oh no!";
                modalTitle.style.color = "#e74c3c";
                modalMessage.textContent = "Too bad, you missed.";
            }
        }

        // Close the popup
        function closeModal() {
            modal.classList.remove('active');
        }

        // Start the game generation
        initGame();

    </script>
</body>
</html>
