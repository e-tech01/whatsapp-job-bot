name: WhatsApp Job Scraper Bot

on:
  schedule:
    - cron: '0 */4 * * *' 
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape-and-send:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Create JSON DB if it doesn't exist
        run: |
          if [ ! -f sent_jobs.json ]; then
            echo "[]" > sent_jobs.json
          fi

      - name: Run Job Bot
        env:
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          ID_INSTANCE: ${{ secrets.ID_INSTANCE }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
        run: python bot.py

      - name: Commit and push Database updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sent_jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: sent_jobs.json" && git push)
